# Release pipeline - on every merge to main:
# release-please opens/updates a release PR; merging that PR builds + pushes the images and bumps the GitOps repo
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          # personal token, so CI runs on the release PR (PRs made by GITHUB_TOKEN don't trigger workflows)
          token: ${{ secrets.RELEASE_TOKEN }}
          release-type: simple # version.txt + CHANGELOG.md, from feat:/fix: commits

  images:
    needs: release-please
    if: needs.release-please.outputs.created == 'true' # only when a release was just made
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GHCR
    strategy:
      matrix:
        app: [api, client]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app }}
          push: true
          # GHCR names must be lowercase
          tags: ghcr.io/telsek/leaky-pipeline-${{ matrix.app }}:${{ needs.release-please.outputs.version }}

  gitops:
    needs: [release-please, images]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Telsek/python-kafka-mongo-gitops
          token: ${{ secrets.RELEASE_TOKEN }}
      # git is the truth: ArgoCD deploys whatever tag is written here
      - name: bump image tag
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          sed -i "s/^tag: .*/tag: \"$VERSION\" # set by the release pipeline/" shop/values.yaml
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git commit -am "chore: deploy shop $VERSION"
          git push