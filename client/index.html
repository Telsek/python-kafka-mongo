<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Leaky Pipeline - Sweets & Artifacts</title>
<style>
  :root {
    --bg: #15111f;
    --panel: #211a30;
    --panel2: #2b2240;
    --text: #f3ecdf;
    --muted: #b3a8c4;
    --gold: #e8b64c;
    --green: #5cc98a;
    --red: #ef5d5d;
    --line: #3a2f52;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    background: var(--bg);
    color: var(--text);
  }

  /* top bar */
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;
    padding: 14px 28px;
    background: rgba(21, 17, 31, 0.95);
    border-bottom: 1px solid var(--line);
  }
  .logo { font-size: 24px; color: var(--gold); letter-spacing: 1px; }
  .logo small { display: block; font-size: 13px; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; }
  .who { display: flex; gap: 10px; align-items: center; }
  .who input {
    padding: 8px 12px; width: 160px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--text); font: inherit;
  }
  .stats { display: flex; gap: 22px; color: var(--muted); font-size: 14px; }
  .stats b { display: block; color: var(--gold); font-size: 20px; }

  main { max-width: 1150px; margin: 0 auto; padding: 10px 24px 60px; }
  h2 { color: var(--gold); font-weight: normal; font-size: 26px; margin: 34px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-style: italic; }

  /* item cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .card {
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; transition: transform .15s, border-color .15s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--gold); }
  .art { width: 100%; height: 130px; }
  .card h3 { font-size: 17px; margin: 8px 0 4px; font-weight: normal; }
  .card p { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; flex: 1; }
  .buyrow { display: flex; justify-content: space-between; align-items: center; }
  .price { color: var(--gold); font-size: 18px; }
  button {
    font: inherit; cursor: pointer;
    padding: 7px 16px; border: none; border-radius: 8px;
    background: var(--gold); color: #241a08;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .6; cursor: wait; }
  button.plain { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }

  /* drawings: dark display case with a spotlight */
  .art { background: radial-gradient(ellipse at 50% 40%, #2e2545 0%, #15111f 75%); border-radius: 10px; }
  .art .t { font-family: monospace; font-weight: bold; }
  td .mini { background: none; }

  /* my items */
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: normal; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
  td .mini { width: 30px; height: 30px; vertical-align: middle; margin-right: 8px; }
  .listhead { display: flex; justify-content: space-between; align-items: end; }
  .empty { color: var(--muted); font-style: italic; }
  .error { color: var(--red); }

  /* popup message */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(120px);
    background: var(--panel2); border: 1px solid var(--gold); border-radius: 10px;
    padding: 12px 20px; transition: transform .3s;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.bad { border-color: var(--red); }
</style>
</head>
<body>

<header>
  <div class="logo">The Leaky Pipeline <small>Sweets &amp; Artifacts</small></div>
  <div class="who">
    <label for="user">Your name</label>
    <input id="user" value="Andreia" maxlength="40">
  </div>
  <div class="stats">
    <div>Items bought<b id="count">0</b></div>
    <div>Total spent<b id="total">$0</b></div>
  </div>
</header>

    <tbody id="items"></tbody>

// every drawing is lit the same way: spotlight behind, soft shadow under, shine on top
function art(tint, inside) {
  return `<svg class="art" viewBox="0 0 100 100" aria-hidden="true">
    <ellipse cx="50" cy="48" rx="40" ry="38" fill="${tint}" opacity=".35" filter="url(#blur6)"/>
    <ellipse cx="50" cy="89" rx="28" ry="4.5" fill="#000" opacity=".6" filter="url(#blur2)"/>
    ${inside}</svg>`;
}
// a shape in a colour, plus the shared light-and-shadow layer on top
function sh(shape, color) {
  return shape.replace("/>", ` fill="${color}"/>`) + shape.replace("/>", ` fill="url(#shade)"/>`);
}
// a small shine spot
const hl = (x, y, rx, ry, rot = 0) =>
  `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#fff" opacity=".75" filter="url(#blur1)" transform="rotate(${rot} ${x} ${y})"/>`;

function bean(x, y, rot, color) {
  return `<g transform="translate(${x} ${y}) rotate(${rot})">
    ${sh('<path d="M-9 -2 C-9 -8 -1 -9 2 -6 C4 -4 6 -7 9 -4 C12 0 8 7 0 7 C-6 7 -9 3 -9 -2 Z"/>', color)}
    <ellipse cx="-3" cy="-3.5" rx="3" ry="1.2" fill="#fff" opacity=".7"/></g>`;
}
function cluster(x, y) {
  const c = "#4e2c14";
  return [[x, y, 9], [x - 7, y + 3, 7], [x + 7, y + 4, 7], [x - 2, y - 7, 6], [x + 5, y - 5, 5]]
    .map(([cx, cy, r]) => sh(`<circle cx="${cx}" cy="${cy}" r="${r}"/>`, c)).join("") + hl(x - 4, y - 8, 2.5, 1.2, -20);
}

// find the drawing for an item name (used in the "My items" table too)
const ALL = [...SWEETS, ...ARTIFACTS];
function drawingFor(name) {
  const found = ALL.find(i => i.name === name);
  return found ? found.svg : art("#2b2240", `<text class="t" x="50" y="60" font-size="28" text-anchor="middle" fill="#b3a8c4">?</text>`);
}

const money = n => "$" + Number(n).toLocaleString("en-US");

// build the cards (our own fixed content, names go in with textContent)
function makeCards(list, boxId) {
  const box = document.getElementById(boxId);
  for (const item of list) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = item.svg;   // the drawing (fixed, written above)

    const h = document.createElement("h3"); h.textContent = item.name;
    const p = document.createElement("p"); p.textContent = item.joke;

    const row = document.createElement("div"); row.className = "buyrow";
    const price = document.createElement("span"); price.className = "price"; price.textContent = money(item.price);
    const btn = document.createElement("button"); btn.textContent = "Buy";
    btn.onclick = () => buy(item, btn);
    row.append(price, btn);

    card.append(h, p, row);
    box.append(card);
  }
}

let toastTimer;
function toast(text, bad) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.className = "show" + (bad ? " bad" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = "", 2500);
}

// send the buy to the client server -> Kafka
async function buy(item, btn) {
  const user = document.getElementById("user").value.trim() || "anonymous";
  btn.disabled = true; btn.textContent = "Sending...";
  try {
    const res = await fetch("/buy", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user, item: item.name, price: item.price }),
    });
    if (!res.ok) throw new Error(res.status);
    toast("Bought " + item.name);
    setTimeout(loadItems, 1000);   // give the API server a second to save it
  } catch (e) {
    toast("Could not send the order (" + e.message + ")", true);
  } finally {
    btn.disabled = false; btn.textContent = "Buy";
  }
}

// ask for all bought items and fill the table
async function loadItems() {
  const body = document.getElementById("items");
  try {
    const res = await fetch("/getAllBoughtItems");
    if (!res.ok) throw new Error(res.status);
    const list = await res.json();
    list.sort((a, b) => String(b.time || "").localeCompare(String(a.time || "")));   // newest first

    body.replaceChildren();
    let total = 0;
    for (const p of list) {
      total += Number(p.price) || 0;
      const tr = document.createElement("tr");

      const itemCell = document.createElement("td");
      const icon = document.createElement("span");
      icon.innerHTML = drawingFor(p.item);              // only our own fixed drawings
      icon.firstChild.setAttribute("class", "art mini");
      const name = document.createElement("span"); name.textContent = p.item;
      itemCell.append(icon, name);

      const userCell = document.createElement("td"); userCell.textContent = p.user;
      const priceCell = document.createElement("td"); priceCell.textContent = money(p.price);
      const timeCell = document.createElement("td");
      timeCell.textContent = p.time ? new Date(p.time).toLocaleString() : "-";

      tr.append(itemCell, userCell, priceCell, timeCell);
      body.append(tr);
    }
    if (list.length === 0) {
      body.innerHTML = '<tr><td colspan="4" class="empty">Nothing bought yet</td></tr>';
    }
    document.getElementById("count").textContent = list.length;
    document.getElementById("total").textContent = money(total);
  } catch (e) {
    body.innerHTML = '<tr><td colspan="4" class="error">Could not load the list - is the API server up?</td></tr>';
  }
}

// Refresh button: show that something happened, even when the list didn't change
async function refresh(btn) {
  btn.disabled = true; btn.textContent = "Refreshing...";
  await loadItems();
  btn.disabled = false; btn.textContent = "Refresh";
  toast("List updated - " + document.getElementById("count").textContent + " items");
}

makeCards(SWEETS, "sweets");
makeCards(ARTIFACTS, "artifacts");
loadItems();
